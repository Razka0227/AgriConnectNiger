services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agriconnect-postgres
    environment:
      POSTGRES_DB: agriconnect
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agriconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect -d agriconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
